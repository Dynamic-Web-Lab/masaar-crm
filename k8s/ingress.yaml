---
# Ingress for Masaar CRM
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: masaar-ingress
  namespace: masaar
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - masaar.example.com
    secretName: masaar-tls
  rules:
  - host: masaar.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: masaar
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: masaar
            port:
              number: 80
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: masaar
            port:
              number: 80
      - path: /webhooks
        pathType: Prefix
        backend:
          service:
            name: masaar
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80

---
# Certificate Issuer (Let's Encrypt)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@masaar.example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
