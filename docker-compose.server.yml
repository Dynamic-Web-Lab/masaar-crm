version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: masaar-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - masaar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buyorsell24_masaar_shared

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: masaar-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://buyorsell24-redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - buyorsell24_masaar_shared

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: masaar-web
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    networks:
      - buyorsell24_masaar_shared

networks:
  buyorsell24_masaar_shared:
    external: true

volumes:
  masaar_postgres_data:
