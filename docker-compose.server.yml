version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: masaar-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - masaar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buyorsell24_masaar_shared

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: masaar-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://masaar:97798f1b1186c86f73473aae2c081222@masaar-postgres:5432/masaar?sslmode=disable
      - REDIS_URL=redis://buyorsell24-redis:6379
      - JWT_SECRET=e1c817e68bb83946a1a89a4c5de58262a3a5e0ca02563ef8a9c320de602a04b2
      - APP_ENV=production
      - ALLOWED_ORIGINS=https://masaar.dynamicweblab.com
      - NEXT_PUBLIC_API_URL=https://masaar.dynamicweblab.com
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - buyorsell24_masaar_shared

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: masaar-web
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://masaar.dynamicweblab.com
    depends_on:
      - api
    networks:
      - buyorsell24_masaar_shared
    ports:
      - "3000:3000"

networks:
  buyorsell24_masaar_shared:
    external: true

volumes:
  masaar_postgres_data:
